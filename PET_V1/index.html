<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PET | Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">₱</span><div><strong>PET</strong><small>Personal Expense Tracker</small></div></div>
      <nav>
        <button class="nav-link active" data-page="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-link" data-page="income">↗ <span>Income</span></button>
        <button class="nav-link" data-page="expenses">↘ <span>Expenses</span></button>
        <button class="nav-link" data-page="budget">◎ <span>Budget</span></button>
        <button class="nav-link" data-page="reports">▥ <span>Reports</span></button>
      </nav>

      <header class="topbar"><div><p class="eyebrow">YOUR MONEY, IN CONTROL</p><h1 id="page-title">Dashboard</h1></div><div class="today" id="today"></div></header>
      <section id="app-content" aria-live="polite"></section>
      <footer>Built by Team PET · Agile & GitHub Project</footer>
    </main>
  </div>
  <script src="js/core.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/income.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/budget.js"></script>

  <script src="js/app.js"></script>

</html>
